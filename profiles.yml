config:
  partial_parse: true
insurance_project:
  target: prod
  outputs:
    prod:
      type: fabric
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('DBT_FABRIC_SERVER') }}"
      port: 1433
      database: "wh_insurance"
      method: spark
      schema: silver
      authentication: ServicePrincipal
      tenant_id: "{{ env_var('DBT_FABRIC_TENANT_ID') }}"
      client_id: "{{ env_var('DBT_FABRIC_CLIENT_ID') }}"
      client_secret: "{{ env_var('DBT_FABRIC_CLIENT_SECRET') }}"
      threads: 4
      timeout: 300
      retries: 1

    dev:
      type: fabric
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('DBT_FABRIC_SERVER') }}"
      port: 1433
      database: "wh_insurance"
      method: spark
      schema: silver
      authentication: ServicePrincipal
      tenant_id: "{{ env_var('DBT_FABRIC_TENANT_ID') }}"
      client_id: "{{ env_var('DBT_FABRIC_CLIENT_ID') }}"
      client_secret: "{{ env_var('DBT_FABRIC_CLIENT_SECRET') }}"
      threads: 4
      timeout: 300
      retries: 1
